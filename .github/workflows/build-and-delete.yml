name: Build Godot Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    # استفاده از محیط آماده‌ی گودوت برای اندروید
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3-android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          apt-get update && apt-get install -y python3

      - name: Generate Project Files via Python
        run: |
          # اجرای اسکریپت شما برای ساخت ساختار کامل پروژه گودوت
          python3 generate_godot_engine.py

      - name: Build Android APK
        run: |
          echo "در حال کامپایل پروژه گودوت به APK..."
          mkdir -p build
          
          # اجرای موتور گودوت در حالت بدون گرافیک (Headless) برای خروجی اندروید
          # (نکته: برای خروجی نهایی اندروید، وجود فایل تنظیمات export_presets.cfg در پروژه الزامی است)
          godot --headless --export-release "Android" build/game_engine_output.apk
          
          echo "فرآیند ساخت به پایان رسید!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersianGulf-Engine-Android-App
          path: build/game_engine_output.apk
          # فایل دیگر خودکار پاک نمی‌شود و تا زمانی که خودتان بخواهید در گیت‌هاب باقی می‌ماند
