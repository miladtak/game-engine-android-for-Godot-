name: Build Godot Android APK Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Project Files & Export Config
        run: |
          python3 generate_godot_engine.py

      - name: Package Project for Android
        run: |
          mkdir -p build
          echo "در حال پکیج کردن پروژه گودوت همراه با فایل‌های تنظیمات..."
          
          # فشرده‌سازی کامل پروژه به همراه تنظیمات اکسپورت برای انتقال و تست نهایی
          zip -r build/GameEngine_PersianGulf_Project.zip project.godot export_presets.cfg scenes/ scripts/
          
          echo "پکیج پروژه آماده شد."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersianGulf-Engine-Project-Files
          path: build/GameEngine_PersianGulf_Project.zip
